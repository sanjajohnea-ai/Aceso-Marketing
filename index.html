<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Aceso Solutions | Digital Marketing, Ads & Automation for SMEs</title>
    <meta name="title" content="Aceso Solutions | Digital Marketing, Ads & Automation for SMEs" />
    <meta name="description" content="Aceso Solutions delivers ROI-focused social media management, Meta & TikTok ads, conversion websites, WhatsApp automation, and tailored digital growth packages for SMEs." />
    <meta name="keywords" content="digital marketing Kenya, social media management, Meta ads, TikTok ads, WhatsApp business automation, SEO services Nairobi, SME marketing agency, growth audit" />
    <meta name="author" content="Aceso Solutions" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://acesosolutions.co.ke" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acesosolutions.co.ke" />
    <meta property="og:title" content="Aceso Solutions | Digital Growth Partner for SMEs" />
    <meta property="og:description" content="Flexible, transparent digital growth packages: Social Media Management from KSh 10,000/mo, targeted advertising, WhatsApp automation, and custom strategy." />
    <meta property="og:site_name" content="Aceso Solutions" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://acesosolutions.co.ke" />
    <meta property="twitter:title" content="Aceso Solutions | Digital Marketing & Growth for SMEs" />
    <meta property="twitter:description" content="Build your brand and convert customers with transparent, flexible marketing packages tailored to your goals." />

    <!-- Fonts: Inter & Sans-Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD structured data for LocalBusiness & ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Aceso Solutions",
        "description": "Digital solutions and marketing agency providing customer acquisition, social media management, paid advertising, and marketing automation for SMEs.",
        "url": "https://acesosolutions.co.ke",
        "priceRange": "KSh 10,000 - KSh 100,000",
        "areaServed": "Kenya",
        "serviceType": [
          "Social Media Management",
          "Meta Ads Management",
          "TikTok Advertising",
          "Website Design & Landing Pages",
          "WhatsApp Business Automation",
          "Search Engine Optimization (SEO)"
        ],
        "offers": [
          {
            "@type": "Offer",
            "name": "Essential Package",
            "price": "10000",
            "priceCurrency": "KES",
            "description": "1 Social Platform, 8 Posts/mo, Basic Graphics, Caption writing & Community Management"
          },
          {
            "@type": "Offer",
            "name": "Growth Package",
            "price": "20000",
            "priceCurrency": "KES",
            "description": "2 Social Platforms, 12-16 Posts/mo, 4 Short-form videos, Strategy call & Performance report"
          },
          {
            "@type": "Offer",
            "name": "Business Package",
            "price": "35000",
            "priceCurrency": "KES",
            "description": "Up to 3 Social Platforms, 20 Posts/mo, 8 Videos, Paid ads management & Deep-dive strategy"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased selection:bg-blue-600 selection:text-white font-sans">
    <div id="root"></div>
